<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="670" viewBox="0 0 1160 670"><rect width="100%" height="100%" fill="#f4f5f9"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="36" y="45" font-size="26" fill="#24324c">运行阶段接线图  ·  微雪 A/A，电脑只接 ESP32</text><rect x="40" y="95" width="220" height="120" rx="20" fill="white" stroke="#6155d9" stroke-width="2"/><text x="60" y="127" font-size="22" fill="#6155d9">电脑</text><text x="60" y="160" font-size="17" fill="#24324c">USB 数据线</text><text x="60" y="189" font-size="17" fill="#24324c">ESP32 UART / COM 口</text><rect x="350" y="95" width="320" height="280" rx="20" fill="white" stroke="#6155d9" stroke-width="2"/><text x="370" y="127" font-size="22" fill="#6155d9">ESP32-S3 N16R8</text><text x="370" y="160" font-size="17" fill="#24324c">3V3   →   BMI270 3V3</text><text x="370" y="189" font-size="17" fill="#24324c">GND   →   BMI270 GND</text><text x="370" y="218" font-size="17" fill="#24324c">GPIO6 →   BMI270 SDA</text><text x="370" y="247" font-size="17" fill="#24324c">GPIO7 →   BMI270 SCL</text><text x="370" y="276" font-size="17" fill="#24324c">GPIO17 → 微雪 TX</text><text x="370" y="305" font-size="17" fill="#24324c">GPIO18 → 微雪 RX</text><text x="370" y="334" font-size="17" fill="#24324c">GND    → 微雪 GND</text><rect x="790" y="95" width="320" height="170" rx="20" fill="white" stroke="#188476" stroke-width="2"/><text x="810" y="127" font-size="22" fill="#188476">BMI270 · 固定在底座</text><text x="810" y="160" font-size="17" fill="#24324c">插在独立孔组 / 小面包板</text><text x="810" y="189" font-size="17" fill="#24324c">INT 不接；3.3V 供电</text><text x="810" y="218" font-size="17" fill="#24324c">随底座一起倾倒</text><rect x="790" y="325" width="320" height="120" rx="20" fill="white" stroke="#6155d9" stroke-width="2"/><text x="810" y="357" font-size="22" fill="#6155d9">微雪 Bus Servo Adapter (A)</text><text x="810" y="390" font-size="17" fill="#24324c">两个跳线帽都在 A</text><text x="810" y="419" font-size="17" fill="#24324c">运行时不接微雪 USB</text><rect x="350" y="470" width="320" height="110" rx="20" fill="white" stroke="#d44e62" stroke-width="2"/><text x="370" y="502" font-size="22" fill="#d44e62">独立稳压 5V</text><text x="370" y="535" font-size="17" fill="#24324c">正极 → 微雪 V/+</text><text x="370" y="564" font-size="17" fill="#24324c">负极 → 微雪 G/-</text><rect x="790" y="500" width="320" height="100" rx="20" fill="white" stroke="#188476" stroke-width="2"/><text x="810" y="532" font-size="22" fill="#188476">原装三芯线 → 两颗舵机</text><text x="810" y="565" font-size="17" fill="#24324c">下 ID2 → 上 ID1</text><path d="M260 152 L350 152" fill="none" stroke="#6155d9" stroke-width="4"/><path d="M670 180 L790 180" fill="none" stroke="#188476" stroke-width="4"/><path d="M670 330 L790 365" fill="none" stroke="#6155d9" stroke-width="4"/><path d="M670 518 L755 518" fill="none" stroke="#d44e62" stroke-width="4"/><path d="M755 518 L755 416" fill="none" stroke="#d44e62" stroke-width="4"/><path d="M755 416 L790 416" fill="none" stroke="#d44e62" stroke-width="4"/><path d="M950 445 L950 500" fill="none" stroke="#188476" stroke-width="4"/><text x="40" y="625" font-size="18" fill="#b43e51">12V 若使用：仅接降压板输入；固定 5V 输出再接微雪。舵机电流不经过 ESP32 或面包板。</text><text x="40" y="653" font-size="16" fill="#768198">按引脚丝印核对；这是电气关系示意，不代表实际针脚排列和孔位。</text></g></svg>