<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900" role="img"><style>text{font-family:"Microsoft YaHei UI","Noto Sans CJK SC",sans-serif}</style><rect x="0" y="0" width="1100" height="900" rx="18" fill="#f4f5f9"/><text x="55" y="65" font-size="30" fill="#243247" text-anchor="start">ESP32-C3 SuperMini · 本次实物正面针脚</text><text x="55" y="105" font-size="20" fill="#617086" text-anchor="start">元件面朝自己 · USB-C 在上方 · 丝印优先于左右位置</text><rect x="340" y="175" width="420" height="615" rx="18" fill="#253f53"/><rect x="455" y="150" width="190" height="95" rx="18" fill="#cbd3dc"/><text x="550" y="210" font-size="27" fill="#243247" text-anchor="middle">USB-C</text><text x="550" y="360" font-size="31" fill="#ffffff" text-anchor="middle">ESP32-C3</text><circle cx="340" cy="285" r="12" fill="#a95015" stroke="#fff" stroke-width="2"/><text x="302" y="293" font-size="26" fill="#a95015" text-anchor="end">5</text><circle cx="760" cy="285" r="12" fill="#8995a6" stroke="#fff" stroke-width="2"/><text x="800" y="293" font-size="26" fill="#8995a6" text-anchor="start">5V</text><text x="70" y="292" font-size="20" fill="#a95015" text-anchor="start">⑥ 微雪 RX</text><text x="850" y="292" font-size="18" fill="#617086" text-anchor="start">留空，不接舵机电源</text><circle cx="340" cy="347" r="12" fill="#147d9b" stroke="#fff" stroke-width="2"/><text x="302" y="355" font-size="26" fill="#147d9b" text-anchor="end">6</text><circle cx="760" cy="347" r="12" fill="#354454" stroke="#fff" stroke-width="2"/><text x="800" y="355" font-size="26" fill="#354454" text-anchor="start">G</text><text x="70" y="354" font-size="20" fill="#147d9b" text-anchor="start">③ IMU SDA</text><text x="890" y="354" font-size="18" fill="#354454" text-anchor="start">②⑦ 共地</text><circle cx="340" cy="409" r="12" fill="#8664b5" stroke="#fff" stroke-width="2"/><text x="302" y="417" font-size="26" fill="#8664b5" text-anchor="end">7</text><circle cx="760" cy="409" r="12" fill="#c13f3f" stroke="#fff" stroke-width="2"/><text x="800" y="417" font-size="26" fill="#c13f3f" text-anchor="start">3V</text><text x="70" y="416" font-size="20" fill="#8664b5" text-anchor="start">④ IMU SCL</text><text x="890" y="416" font-size="18" fill="#c13f3f" text-anchor="start">① IMU 3V3</text><circle cx="340" cy="471" r="12" fill="#8995a6" stroke="#fff" stroke-width="2"/><text x="302" y="479" font-size="26" fill="#8995a6" text-anchor="end">8</text><circle cx="760" cy="471" r="12" fill="#be3a72" stroke="#fff" stroke-width="2"/><text x="800" y="479" font-size="26" fill="#be3a72" text-anchor="start">4</text><text x="890" y="478" font-size="18" fill="#be3a72" text-anchor="start">⑤ 微雪 TX</text><circle cx="340" cy="533" r="12" fill="#8995a6" stroke="#fff" stroke-width="2"/><text x="302" y="541" font-size="26" fill="#8995a6" text-anchor="end">9</text><circle cx="760" cy="533" r="12" fill="#8995a6" stroke="#fff" stroke-width="2"/><text x="800" y="541" font-size="26" fill="#8995a6" text-anchor="start">3</text><circle cx="340" cy="595" r="12" fill="#8995a6" stroke="#fff" stroke-width="2"/><text x="302" y="603" font-size="26" fill="#8995a6" text-anchor="end">10</text><circle cx="760" cy="595" r="12" fill="#8995a6" stroke="#fff" stroke-width="2"/><text x="800" y="603" font-size="26" fill="#8995a6" text-anchor="start">2</text><circle cx="340" cy="657" r="12" fill="#8995a6" stroke="#fff" stroke-width="2"/><text x="302" y="665" font-size="26" fill="#8995a6" text-anchor="end">20</text><circle cx="760" cy="657" r="12" fill="#8995a6" stroke="#fff" stroke-width="2"/><text x="800" y="665" font-size="26" fill="#8995a6" text-anchor="start">1</text><circle cx="340" cy="719" r="12" fill="#8995a6" stroke="#fff" stroke-width="2"/><text x="302" y="727" font-size="26" fill="#8995a6" text-anchor="end">21</text><circle cx="760" cy="719" r="12" fill="#8995a6" stroke="#fff" stroke-width="2"/><text x="800" y="727" font-size="26" fill="#8995a6" text-anchor="start">0</text><rect x="405" y="265" width="95" height="46" rx="10" fill="#101f2a"/><text x="452" y="296" font-size="20" fill="#fff" text-anchor="middle">BOOT</text><rect x="600" y="265" width="95" height="46" rx="10" fill="#101f2a"/><text x="647" y="296" font-size="20" fill="#fff" text-anchor="middle">RST</text><text x="550" y="440" font-size="23" fill="#fff" text-anchor="middle">左：BOOT     右：RST</text><text x="550" y="490" font-size="35" fill="#ffc989" text-anchor="middle">5 ≠ 5V</text><text x="550" y="535" font-size="19" fill="#fff" text-anchor="middle">3V 是 3.3V 电源，3 是 GPIO3</text><text x="550" y="595" font-size="20" fill="#fff" text-anchor="middle">信号：UART1 TX4 / RX5</text><text x="550" y="635" font-size="20" fill="#fff" text-anchor="middle">IMU：SDA6 / SCL7</text><text x="55" y="845" font-size="20" fill="#617086" text-anchor="start">示意图非 PCB 工程图；不同批次板型请核对标字。底座/模块连接见下一张图。</text></svg>