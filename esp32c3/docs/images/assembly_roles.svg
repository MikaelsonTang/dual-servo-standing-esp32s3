<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><rect width="100%" height="100%" fill="#f4f5f9"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="35" y="45" font-size="26" fill="#24324c">装配方向  ·  上 ID1 / 下 ID2</text><rect x="160" y="448" width="300" height="38" rx="12" fill="#dbe0f1"/><rect x="250" y="320" width="130" height="125" rx="18" fill="#6155d9"/><path d="M225 330V208H410V330" fill="none" stroke="#afa7f1" stroke-width="22"/><rect x="250" y="180" width="130" height="85" rx="18" fill="#188476"/><path d="M315 183V83" stroke="#6155d9" stroke-width="24" stroke-linecap="round"/><text x="510" y="110" font-size="19" fill="#24324c">顶部长杆：与 ID1 输出连接</text><text x="510" y="225" font-size="19" fill="#24324c">上舵机 ID1：固定在中间支架</text><text x="510" y="300" font-size="19" fill="#24324c">中间支架：由 ID2 带动</text><text x="510" y="385" font-size="19" fill="#24324c">下舵机 ID2：机壳固定到底座</text><text x="510" y="470" font-size="19" fill="#24324c">底座：双长槽侧定义为前方</text><text x="40" y="530" font-size="17" fill="#768198">两关节轴互相垂直；先调机械零位再紧固舵盘。图仅示意角色，尺寸与孔位看 STL/实物。</text></g></svg>