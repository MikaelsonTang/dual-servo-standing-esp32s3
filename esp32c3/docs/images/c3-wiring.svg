<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img"><style>text{font-family:"Microsoft YaHei UI","Noto Sans CJK SC",sans-serif}</style><rect x="0" y="0" width="1200" height="1050" rx="18" fill="#f4f5f9"/><text x="45" y="60" font-size="32" fill="#243247" text-anchor="start">C3 V24 · 七根线 + 独立舵机供电</text><text x="45" y="100" font-size="21" fill="#617086" text-anchor="start">功能连接示意，不代表插针顺序、面包板孔位或原装线颜色</text><rect x="55" y="155" width="280" height="390" rx="18" fill="#fff"/><text x="80" y="200" font-size="26" fill="#243247" text-anchor="start">BMI270</text><rect x="490" y="150" width="260" height="500" rx="18" fill="#e5e2ff"/><text x="520" y="197" font-size="27" fill="#243247" text-anchor="start">ESP32-C3</text><text x="520" y="232" font-size="22" fill="#243247" text-anchor="start">SuperMini</text><rect x="915" y="200" width="240" height="370" rx="18" fill="#fff"/><text x="940" y="245" font-size="23" fill="#243247" text-anchor="start">微雪 Adapter (A)</text><text x="940" y="285" font-size="20" fill="#c13f3f" text-anchor="start">两个跳线帽 A / A</text><text x="90" y="297" font-size="21" fill="#c13f3f" text-anchor="start">1  3V3</text><text x="520" y="297" font-size="24" fill="#c13f3f" text-anchor="start">3V</text><path d="M220 290 H490" stroke="#c13f3f" stroke-width="4" fill="none"/><text x="90" y="352" font-size="21" fill="#354454" text-anchor="start">2  GND</text><text x="520" y="352" font-size="24" fill="#354454" text-anchor="start">G</text><path d="M220 345 H490" stroke="#354454" stroke-width="4" fill="none"/><text x="90" y="407" font-size="21" fill="#147d9b" text-anchor="start">3  SDA</text><text x="520" y="407" font-size="24" fill="#147d9b" text-anchor="start">6</text><path d="M220 400 H490" stroke="#147d9b" stroke-width="4" fill="none"/><text x="90" y="462" font-size="21" fill="#8664b5" text-anchor="start">4  SCL</text><text x="520" y="462" font-size="24" fill="#8664b5" text-anchor="start">7</text><path d="M220 455 H490" stroke="#8664b5" stroke-width="4" fill="none"/><text x="680" y="352" font-size="24" fill="#be3a72" text-anchor="start">4</text><text x="960" y="352" font-size="21" fill="#be3a72" text-anchor="start">5  TX</text><path d="M735 345 H940" stroke="#be3a72" stroke-width="4" fill="none"/><text x="680" y="407" font-size="24" fill="#a95015" text-anchor="start">5</text><text x="960" y="407" font-size="21" fill="#a95015" text-anchor="start">6  RX</text><path d="M735 400 H940" stroke="#a95015" stroke-width="4" fill="none"/><text x="680" y="462" font-size="24" fill="#354454" text-anchor="start">G</text><text x="960" y="462" font-size="21" fill="#354454" text-anchor="start">7  GND</text><path d="M735 455 H940" stroke="#354454" stroke-width="4" fill="none"/><text x="515" y="555" font-size="22" fill="#c13f3f" text-anchor="start">5V 针脚留空</text><text x="515" y="600" font-size="22" fill="#243247" text-anchor="start">USB-C 接电脑</text><text x="75" y="505" font-size="20" fill="#617086" text-anchor="start">INT 留空</text><rect x="70" y="705" width="310" height="115" rx="18" fill="#fff"/><text x="95" y="750" font-size="25" fill="#243247" text-anchor="start">独立稳压 5V 电源</text><text x="95" y="788" font-size="20" fill="#c13f3f" text-anchor="start">不经过 C3 / 面包板</text><rect x="485" y="705" width="270" height="115" rx="18" fill="#fff"/><text x="510" y="750" font-size="25" fill="#243247" text-anchor="start">下舵机 ID2</text><text x="510" y="788" font-size="20" fill="#243247" text-anchor="start">原装三芯线 V/G/D</text><rect x="890" y="705" width="270" height="115" rx="18" fill="#fff"/><text x="915" y="750" font-size="25" fill="#243247" text-anchor="start">上舵机 ID1</text><text x="915" y="788" font-size="20" fill="#243247" text-anchor="start">原装三芯线 V/G/D</text><path d="M220 820 V855 H845 V520 H915" stroke="#c13f3f" stroke-width="5" fill="none"/><text x="55" y="640" font-size="19" fill="#c13f3f" text-anchor="start">电源正负极 → 微雪电源端子</text><path d="M1035 570 V655 H620 V705 M755 765 H890" stroke="#188476" stroke-width="6" fill="none"/><text x="900" y="645" font-size="18" fill="#188476" text-anchor="start">微雪三芯舵机口</text><text x="55" y="905" font-size="21" fill="#243247" text-anchor="start">G 为公共地：C3 G、IMU GND、微雪 GND 必须连通；可用确认连续的地轨分线。</text><text x="55" y="950" font-size="20" fill="#243247" text-anchor="start">微雪 TX → C3 4；微雪 RX → C3 5。本板按官方 A 位同名接法，不套用其他转接器。</text><text x="55" y="995" font-size="21" fill="#c13f3f" text-anchor="start">12V 适配器若使用，必须先降到已测量确认的 5V，再接微雪。</text></svg>